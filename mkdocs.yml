site_name: Software Quality Knowledge Base
site_description: Evidence-first guidance for reviewing software changes and systems.
site_url: https://a3-harness.github.io/code-quality-wiki/
site_dir: .build-site
repo_url: https://github.com/a3-harness/code-quality-wiki
repo_name: a3-harness/code-quality-wiki
edit_uri: edit/main/docs/
copyright: Built for practitioners who automate facts, assist inference, and escalate judgment.
exclude_docs: |
  backlog/
  deliverables-status/
  demos/
  phases/
  installed-software.md

theme:
  name: material
  language: en
  icon:
    logo: material/check-decagram-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Review process:
      - Workflow: process/review-workflow.md
      - Evidence and confidence: process/evidence-and-confidence.md
      - Severity and decisions: process/severity-and-decisions.md
      - Escalation: process/escalation.md
      - Establish project context: process/project-context.md
      - AI software engineering: process/ai-software-engineering.md
  - Quality dimensions:
      - 1. Correctness: dimensions/01-correctness.md
      - 2. Readability: dimensions/02-readability.md
      - 3. Design: dimensions/03-design.md
      - 4. Architecture: dimensions/04-architecture.md
      - 5. Maintainability: dimensions/05-maintainability.md
      - 6. Test quality: dimensions/06-test-quality.md
      - 7. Security and privacy: dimensions/07-security.md
      - 8. Reliability: dimensions/08-reliability.md
      - 9. Performance: dimensions/09-performance.md
      - 10. Concurrency: dimensions/10-concurrency.md
      - 11. Data integrity: dimensions/11-data-integrity.md
      - 12. Operability: dimensions/12-operability.md
      - 13. Compatibility: dimensions/13-compatibility.md
      - 14. Safety and compliance: dimensions/14-safety.md
      - 15. Change quality: dimensions/15-pr-scope.md
  - Research:
      - Research plan: research/research-plan.md
      - Reference map: research/reference-map.md
      - Gaps and conflicts: research/gaps-and-conflicts.md
      - Resources to acquire: research/user-acquisition-list.md
  - Specialist guidance:
      - Python middle layer: specialists/python-middle-layer.md
      - Functional-style Python: specialists/python-functional.md
      - Python data layer: specialists/python-data-layer.md
      - SQL quality: specialists/sql.md
      - React: specialists/react.md
      - Node.js: specialists/node.md
      - Next.js: specialists/nextjs.md
      - Security engineering: specialists/security.md
      - Data architecture: specialists/data-architecture.md
      - Data engineering: specialists/data-engineering.md
      - Prompt design: specialists/prompt-design.md
      - Agent design: specialists/agent-design.md
      - Agent engineering: specialists/agent-engineering.md
      - AI software engineering: specialists/ai-software-engineering.md
  - Constructing quality tools:
      - Source ingestion: tooling/source-ingestion.md
      - Structured knowledge contracts: tooling/knowledge-contracts.md
      - Evidence pipeline: tooling/evidence-pipeline.md
      - Knowledge retrieval: tooling/knowledge-retrieval.md
      - AI-assisted review: tooling/ai-assisted-review.md
      - Evaluation and promotion gates: tooling/evaluation.md
      - Reproducible wiki publication: tooling/wiki-publication.md
      - Knowledge governance: tooling/governance.md
      - Project-context rendering: tooling/project-context-rendering.md
      - Coding-harness readiness audit: tooling/coding-harness-audit.md
  - Contribute: process/contributing-knowledge.md
